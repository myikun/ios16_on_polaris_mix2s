name: xnu-diag

# One purpose: when a build fails, show why, in a log short enough to read.
#
# The normal workflow prints the whole build, and GitHub truncates that view long
# before the end -- the error lines are never visible. This one keeps the build's
# output in a file and prints only the error lines (plus the tail), so the step's
# log is a few dozen lines.
#
# It is a separate workflow: nothing here touches xnu.yml, and it uploads nothing
# unless the build succeeds.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: |
          brew install jq gum bash cmake ninja >/dev/null 2>&1 || true
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | head -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          sudo xcode-select -s "$XC"
          git init -q dxb
          git -C dxb fetch -q --depth 1 https://github.com/blacktop/darwin-xnu-build 663906528d1cd5ea8fde7de6f16de73db9511549
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh

      - name: Build quietly
        working-directory: dxb
        env:
          # without these build.sh asks its questions through gum, and there is no TTY
          MACOS_VERSION: "13.5"
          KERNEL_CONFIG: RELEASE
          MACHINE_CONFIG: SWEET
          MAKEFLAGS: ""
        run: |
          set +e
          bash build.sh > build.log 2>&1
          echo "build exit code: $?"
          ls -l build.log

      - name: Why it failed
        if: always()
        run: |
          LOG=dxb/build.log
          echo "=============== ERRORS ==============="
          grep -n "error:" "$LOG" | grep -v "Werror" | tail -25 || echo "(no 'error:' lines)"
          echo
          echo "=============== OUR CODE ==============="
          grep -n -E "SweetPlatformExpert|RedwoodGPU|mi8_gpu_ready|polaris_gpu_fw" "$LOG" | tail -25 || echo "(nothing about our files)"
          echo
          echo "=============== LINKER ==============="
          grep -n -A6 "Undefined symbols" "$LOG" | tail -30 || echo "(no linker error)"
          echo
          echo "=============== LAST 30 LINES ==============="
          tail -30 "$LOG"

      - name: Upload the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: dxb/build.log
          if-no-files-found: warn
