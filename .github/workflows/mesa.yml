name: mesa

# Builds the GPU user space with ios-sweet-gpu's pipeline (their pinned donors and
# their build script, unchanged), then builds topaz_test against the libOSMesa that
# came out of it.
#
# topaz_test exists because gl_test died silently: launchd redirects stdout to a file,
# stdio buffers it, and a SIGKILL loses the buffer. topaz_test sets stdout unbuffered
# and prints before and after every step.
#
# Upload: out/ -- libOSMesa.8.dylib, the topaz libraries, gl_test, topaz_test.

on:
  workflow_dispatch:

jobs:
  gpu:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Donor sources (their pinned revisions)
        run: |
          git clone -q https://github.com/MakrSas/ios-topaz donor/topaz
          git -C donor/topaz checkout -q e4772911e116ab4ab6c4ac1f38e6106fefe8b483
          git clone -q https://github.com/oosexgang/hackios-xnu-kernel donor/hackios
          git -C donor/hackios checkout -q a3384e031eb1e605cf37adaefc19991f04f6274b
          git clone -q https://github.com/limonetexd/ios-sweet-gpu sweetgpu
          ls -l sweetgpu/userland/build-gpu.sh

      - name: Tools
        run: |
          brew install meson ninja bison pkg-config || true
          export PATH="$(brew --prefix bison)/bin:$PATH"
          bison --version | head -1

      - name: Build the user space (their script)
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          bash sweetgpu/userland/build-gpu.sh donor out 2>&1 | tail -40

      - name: Build topaz_test against libOSMesa
        if: always()
        run: |
          set +e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          ls -l out/
          if [ -f out/libOSMesa.8.dylib ]; then
            xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O1 \
              -framework CoreFoundation -framework IOKit \
              src/topaz_test.c out/libOSMesa.8.dylib -o out/topaz_test
            echo "clang exit: $?"
            file out/topaz_test
            codesign -f -s - out/topaz_test && echo signed
          else
            echo "no libOSMesa to link against"
          fi

      - name: What we got
        if: always()
        run: |
          ls -l out || true
          for f in out/*.dylib out/topaz_test out/gl_test; do
            [ -f "$f" ] && file "$f"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-userland
          path: out/
          if-no-files-found: warn
