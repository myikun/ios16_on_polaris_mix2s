name: mesa

# Mesa's freedreno for iOS arm64, built the way HackiOS builds it (tools/mk-mesa.sh),
# not the way I guessed at for three runs: same Mesa release they pin (25.0.7),
# ALL of their tools/mesa/*.patch, their libdrm stand-in and AIR frontend copied
# into the tree at the paths their patches expect, their meson options verbatim.
#
# Produces libOSMesa.8.dylib (install name /redwood/lib/libOSMesa.8.dylib) -- the
# library that talks to the kernel's RedwoodGPU service through hakios.drm.c.

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: Mesa release (HackiOS pins 25.0.7; their patches are made for it)
        default: "25.0.7"

jobs:
  mesa:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Deps
        run: |
          brew install meson ninja bison flex llvm python3 lxml || true
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          meson --version; ninja --version; llvm-strip --version | head -1

      - name: HackiOS's mesa tree (patches, libdrm stand-in, AIR frontend)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/oosexgang/hackios-xnu-kernel.git hakios
          cd hakios
          git sparse-checkout set tools/mesa
          ls -l tools/mesa | head -30
          echo "--- patches:"; ls tools/mesa/*.patch | wc -l
          echo "--- drm stand-in:"; ls -l tools/mesa/hakios-drm
          echo "--- AIR:"; ls tools/mesa/air | head

      - name: Sources, patches, and the two directories their patches reach for
        run: |
          V=${{ inputs.mesa_version }}
          curl -sL --fail -o "mesa-$V.tar.xz" "https://archive.mesa3d.org/mesa-$V.tar.xz"
          tar xf "mesa-$V.tar.xz"
          cd "mesa-$V"
          for p in ../hakios/tools/mesa/*.patch; do
            echo "--- $(basename $p)"
            patch -p1 --no-backup-if-mismatch < "$p"
          done
          rm -rf src/hakios-drm src/compiler/air
          cp -r ../hakios/tools/mesa/hakios-drm src/hakios-drm
          cp -r ../hakios/tools/mesa/air src/compiler/air
          echo "--- wired in:"; ls src/hakios-drm; ls src/compiler/air | head -3

      - name: Python venv with mako
        run: |
          python3 -m venv venv
          ./venv/bin/pip -q install mako pyyaml packaging
          ./venv/bin/python -c "import mako; print('mako', mako.__version__)"

      - name: Configure and build
        run: |
          V=${{ inputs.mesa_version }}
          # bison and flex first: macOS ships bison 2.3, which cannot parse
          # Mesa's ir3 grammar ("invalid directive: %code")
          export PATH="$PWD/venv/bin:$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix llvm)/bin:$PATH"
          echo "bison: $(bison --version | head -1)"
          echo "flex:  $(flex --version | head -1)"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          cat > cross.ini <<INI
          [binaries]
          c = ['xcrun', '--sdk', 'iphoneos', 'clang', '-arch', 'arm64', '-miphoneos-version-min=16.0']
          cpp = ['xcrun', '--sdk', 'iphoneos', 'clang++', '-arch', 'arm64', '-miphoneos-version-min=16.0', '-fuse-cxa-atexit']
          objc = ['xcrun', '--sdk', 'iphoneos', 'clang', '-arch', 'arm64', '-miphoneos-version-min=16.0']
          ar = 'llvm-ar'
          ranlib = 'llvm-ranlib'
          strip = 'llvm-strip'
          pkg-config = 'false'
          [host_machine]
          system = 'darwin'
          subsystem = 'ios'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'
          [properties]
          needs_exe_wrapper = true
          INI
          cd "mesa-$V"
          meson setup build --cross-file ../cross.ini --wrap-mode=nofallback \
            --prefix=/redwood --libdir=lib --buildtype=release -Db_ndebug=true \
            -Dplatforms= -Dgallium-drivers=softpipe,freedreno -Dfreedreno-kmds=msm \
            -Dvulkan-drivers= -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dosmesa=true -Dllvm=disabled -Dshared-glapi=enabled -Dgles1=disabled \
            -Dgles2=enabled -Dopengl=true \
            -Dzstd=disabled -Dxmlconfig=disabled -Dexpat=disabled -Dshader-cache=disabled \
            -Dvalgrind=disabled -Dlibunwind=disabled -Dglvnd=disabled -Dvideo-codecs= \
            -Dtools= -Dgallium-vdpau=disabled -Dgallium-va=disabled -Dgallium-xa=disabled \
            -Dlmsensors=disabled -Dbuild-tests=false > ../meson-setup.log 2>&1 \
            || { echo "=== meson setup failed ==="; tail -40 ../meson-setup.log; exit 1; }
          echo "meson setup OK, building..."
          ninja -C build > ../ninja.log 2>&1 || { echo "=== ninja failed ==="; grep -n "error:" ../ninja.log | head -30; tail -30 ../ninja.log; exit 1; }
          echo "ninja OK"

      - name: Strip and name it as iOS expects
        run: |
          V=${{ inputs.mesa_version }}
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          mkdir -p out
          llvm-strip -x -o out/libOSMesa.8.dylib "mesa-$V/build/src/gallium/targets/osmesa/libOSMesa.8.dylib"
          install_name_tool -id /redwood/lib/libOSMesa.8.dylib out/libOSMesa.8.dylib
          file out/libOSMesa.8.dylib
          ls -l out/libOSMesa.8.dylib
          nm -gU out/libOSMesa.8.dylib | awk '$3 ~ /^_gl/ { print substr($3, 2) }' > out/exported-gl.txt
          echo "exported gl* functions: $(wc -l < out/exported-gl.txt)"

      - name: What went wrong (if anything)
        if: always()
        run: |
          echo "=== meson setup tail ==="; tail -20 meson-setup.log 2>/dev/null || echo none
          echo "=== ninja errors ==="; grep -n "error:" ninja.log 2>/dev/null | head -20 || echo none
          echo "=== ninja tail ==="; tail -15 ninja.log 2>/dev/null || echo none

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-ios
          path: |
            out/
            meson-setup.log
            ninja.log
          if-no-files-found: warn
