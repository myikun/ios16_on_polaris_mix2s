name: mesa

# The whole GPU user space, built by someone else's proven pipeline instead of my
# own guesses: this is limonetexd/ios-sweet-gpu's .github/workflows/userland.yml,
# run against the same pinned donors, with the output uploaded here.
#
# It produces, in one run:
#   libOSMesa.8.dylib      Mesa 25.0.7 freedreno+softpipe, iOS arm64
#   libtopaz-gl.dylib      eagl.c + gl_osmesa.c  (the EAGL-on-OSMesa shim)
#   libtopaz-inject.dylib  the backboardd loader
#   backboardd             the replacement window server binary
#   gl_test                a triangle drawn with OSMesa and read back
#
# Their recipe also documents the trap that cost us a round: the iOS SDK has no
# IOKit headers, so the build copies them from the macOS SDK.

on:
  workflow_dispatch:

jobs:
  gpu:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Donor sources (their pinned revisions)
        run: |
          git clone -q https://github.com/MakrSas/ios-topaz donor/topaz
          git -C donor/topaz checkout -q e4772911e116ab4ab6c4ac1f38e6106fefe8b483
          git clone -q https://github.com/oosexgang/hackios-xnu-kernel donor/hackios
          git -C donor/hackios checkout -q a3384e031eb1e605cf37adaefc19991f04f6274b
          git clone -q https://github.com/limonetexd/ios-sweet-gpu sweetgpu
          echo "--- their build script:"; ls -l sweetgpu/userland/build-gpu.sh

      - name: Tools
        run: |
          brew install meson ninja bison pkg-config || true
          export PATH="$(brew --prefix bison)/bin:$PATH"
          bison --version | head -1

      - name: Build the user space (their script, unchanged)
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          bash sweetgpu/userland/build-gpu.sh donor out 2>&1 | tail -60

      - name: What we got
        if: always()
        run: |
          ls -l out 2>/dev/null || echo "(no out/)"
          for f in out/*.dylib out/backboardd out/gl_test; do
            [ -f "$f" ] && file "$f"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-userland
          path: out/
          if-no-files-found: warn
