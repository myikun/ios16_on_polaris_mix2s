name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: RELEASE
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "false"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'RELEASE' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    # macos-14 was retired on 2026-11-02; macos-15 ships Xcode 16, whose iig
    # emits IORPC.kernelContent -- patch 0104 adds that field to xnu-8796.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.ref }}-${{ hashFiles('xnu/patches/**') }}
          restore-keys: |
            ccache-${{ github.ref }}-
            ccache-

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh only checks that xcodes exists (Xcode is preinstalled)
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | head -1); [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig
          ccache --version | head -1
          # ccache: xcodebuild cannot spawn a compiler given as "ccache clang"
          # (two words), so give it one executable path instead: a wrapper.
          CLANG=$(xcrun -find clang)
          CLANGXX=$(xcrun -find clang++)
          printf '#!/bin/sh\nexec ccache %s "$@"\n' "$CLANG"   | sudo tee /usr/local/bin/cc-clang    >/dev/null
          printf '#!/bin/sh\nexec ccache %s "$@"\n' "$CLANGXX" | sudo tee /usr/local/bin/cc-clang++  >/dev/null
          sudo chmod +x /usr/local/bin/cc-clang /usr/local/bin/cc-clang++
          # build.sh exports CC/CXX itself, so rewrite those two lines
          sed -i '' 's|^\( *\)export CC=.*|\1export CC="/usr/local/bin/cc-clang"|' dxb/build.sh
          sed -i '' 's|^\( *\)export CXX=.*|\1export CXX="/usr/local/bin/cc-clang++"|' dxb/build.sh
          grep -n 'export CC=\|export CXX=' dxb/build.sh
          /usr/local/bin/cc-clang --version | head -2

      - name: Build
        working-directory: dxb
        env:
          # fail fast: with -k a broken build keeps compiling for minutes
          MAKEFLAGS: ${{ inputs.keep_going == 'true' && '-k' || '' }}
        run: bash build.sh

      # The patched sources, so they can be read here instead of guessed at from
      # the patch series. Small files; they make every later change exact.
      - name: Upload patched sources (display)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-source
          path: dxb/xnu/iokit/Kernel/arm/SweetFramebuffer.cpp
          if-no-files-found: warn

      - name: Upload patched sources (hid)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hid-source
          path: |
            dxb/xnu/iokit/Kernel/arm/hid/SweetHID.cpp
            dxb/xnu/iokit/Kernel/arm/hid/SweetHIDTouch.cpp
          if-no-files-found: warn

      - name: Upload patched sources (device drivers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-source
          path: |
            dxb/xnu/bsd/dev/polaris_touch_i2c.c
            dxb/xnu/bsd/dev/polaris_gpu_fw.c
            dxb/xnu/iokit/Kernel/arm/SweetPlatformExpert.cpp
            dxb/xnu/bsd/sweet_hfs/sweet_hfs_iokit.c
          if-no-files-found: warn

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
